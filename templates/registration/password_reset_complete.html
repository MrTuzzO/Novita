{% extends 'base.html' %}

{% block title %}Password Reset Complete - Novita{% endblock %}

{% block content %}
<section class="mx-auto max-w-3xl px-4 py-12 sm:px-6 lg:px-8">
    <div class="rounded-3xl border border-slate-200 bg-white p-8 text-center shadow-sm">
        <i class="fas fa-check-circle text-5xl text-[var(--color-primary)]"></i>
        <h1 class="mt-4 text-3xl font-bold text-slate-900">Password Reset Complete</h1>
        <p class="mt-3 text-sm text-slate-600">Your password has been successfully reset. You can now sign in with your new password.</p>
        <a href="{% url 'login' %}" class="mt-6 inline-flex rounded-xl bg-[var(--color-primary)] px-5 py-2.5 text-sm font-semibold text-white">Sign In</a>
    </div>
</section>
{% endblock %}
