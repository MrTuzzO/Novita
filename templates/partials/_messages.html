{% if messages %}
<div class="mx-auto mt-4 w-full max-w-7xl px-4 sm:px-6 lg:px-8">
    {% for message in messages %}
    <div class="mb-3 flex items-start justify-between gap-3 rounded-2xl border p-4 shadow-sm {% if message.tags == 'success' %}border-emerald-200 bg-emerald-50 text-emerald-800{% elif message.tags == 'error' or message.tags == 'danger' %}border-red-200 bg-red-50 text-red-800{% elif message.tags == 'warning' %}border-amber-200 bg-amber-50 text-amber-800{% else %}border-blue-200 bg-blue-50 text-blue-800{% endif %}" role="alert">
        <p class="text-sm font-medium">{{ message }}</p>
        <button type="button" onclick="this.parentElement.remove()" class="shrink-0 rounded-lg px-2 py-1 text-xs font-semibold hover:bg-black/10">Close</button>
    </div>
    {% endfor %}
</div>
{% endif %}
